<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hotel Calendar</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

  <link rel="stylesheet" href="sidebar.css">

  <link rel="stylesheet" href="calendar.css">

</head>


<body>

  <!-- SIDEBAR -->

  <aside id="sidebar"></aside>


  <!-- CALENDAR -->

  <main class="calendar-page with-sidebar">

    <div class="calendar-wrapper">


      <!-- HOTEL DAY -->

      <section class="calendar-section">

        <div class="section-number">
          01
        </div>

        <h1>
          Hotel Day
        </h1>

        <iframe src="page1.html?embed=1" class="calendar-frame" title="Hotel Day"></iframe>

      </section>


      <!-- MONTH -->

      <section class="calendar-section">

        <div class="section-number">
          02
        </div>

        <h1>
          Month
        </h1>

        <iframe src="page2.html?embed=1" class="calendar-frame" title="Month"></iframe>

      </section>


      <!-- LAYERS & SHARING -->

      <section class="calendar-section">

        <div class="section-number">
          03
        </div>

        <h1>
          Layers &amp; Sharing
        </h1>

        <iframe src="page3.html?embed=1" class="calendar-frame" title="Layers and Sharing"></iframe>

      </section>


      <!-- PRESSURE -->

      <section class="calendar-section">

        <div class="section-number">
          04
        </div>

        <h1>
          Pressure
        </h1>

        <iframe src="page5.html?embed=1" class="calendar-frame" title="Pressure"></iframe>

      </section>


    </div>

  </main>


  <script src="sidebar.js"></script>

  <script src="calendar.js"></script>

</body>

</html>
